[workspace]
members = [
    "crates/als-resolver",
    "crates/entities",
    "crates/checklog",
    "crates/qc_result",
    "crates/terminology", "crates/project-scaffold",
]
resolver = "2"

[workspace.dependencies]
calamine = "0.35.0"
chrono = "0.4.45"
quick-xml = "0.40.1"
thiserror = "2.0.18"
regex = "1.13.0"
tempfile = "3.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
resolver = "2"
lazy_static = "1.5.0"
scraper = "0.27.0"
